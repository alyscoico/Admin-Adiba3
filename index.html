<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Paguyuban ADIBA 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500;600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #eef2ef; --surface: #ffffff; --ink: #14231d; --muted: #55665e; --line: #d3ddd7;
  --accent: #1b6b55; --accent-ink: #ffffff; --accent-soft: #dcede6;
  --ok: #1d7a4b; --ok-soft: #dcf0e4; --warn: #8f5a00; --warn-soft: #f7ebd0;
  --idle: #5d646b; --idle-soft: #e6e9ec; --danger: #b3261e;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0e1512; --surface: #16201b; --ink: #e6efea; --muted: #94a69c; --line: #27362f;
    --accent: #5fc4a0; --accent-ink: #07201a; --accent-soft: #1c3a2f;
    --ok: #6fd69a; --ok-soft: #1a3527; --warn: #e7b25a; --warn-soft: #3a2d12;
    --idle: #a3abb3; --idle-soft: #262d33; --danger: #ff8a80;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
.wrap { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--font-display); font-size: clamp(30px, 6vw, 44px); line-height: 1.05; margin: 4px 0 0; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; }
.me { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.role { font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.role.read { background: var(--idle-soft); color: var(--idle); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; font-weight: 600; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

.stats { display: flex; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.stat { flex: 1 1 130px; padding: 14px 18px; border-left: 1px solid var(--line); min-width: 0; }
.stat:first-child { border-left: 0; }
.stat .n { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 12px; color: var(--muted); }
@media (max-width: 560px) {
  .stat { flex-basis: 45%; border-left: 0; border-top: 1px solid var(--line); }
  .stat:nth-child(-n+2) { border-top: 0; }
  .stat:nth-child(even) { border-left: 1px solid var(--line); }
}

.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tools .grow { flex: 1 1 240px; min-width: 0; }
.field { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; width: 100%; min-width: 0; }
.tools select.field { width: auto; flex: 0 1 auto; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; font-weight: 600; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .55; cursor: default; }
.spacer { flex: 1 1 0; }

.note { font-size: 13px; color: var(--muted); padding: 10px 14px; border: 1px dashed var(--line); border-radius: 8px; }
.note.err { color: var(--danger); border-color: var(--danger); }
.mine { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 10px; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.thead, .row { display: grid; gap: 8px 16px; align-items: center; padding: 12px 16px; }
.cols-rumah { grid-template-columns: 96px minmax(0,1.7fr) minmax(0,1.1fr) 124px 72px 64px; }
.cols-akun { grid-template-columns: minmax(0,1.4fr) minmax(0,1fr) 90px 110px 100px 150px; }
.thead { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--accent-soft); padding-block: 9px; }
ul.rows { list-style: none; margin: 0; padding: 0; }
.row { border-top: 1px solid var(--line); }
.row.me-row { background: var(--accent-soft); }
.plate { display: inline-block; justify-self: start; font-family: var(--font-mono); font-weight: 600; font-size: 14px; letter-spacing: .05em;
  border: 2px solid var(--accent); color: var(--accent); border-radius: 5px; padding: 3px 9px; background: var(--surface); }
.nama { font-weight: 600; overflow-wrap: anywhere; }
.who { min-width: 0; overflow-wrap: anywhere; }
.mono { font-family: var(--font-mono); font-size: 13px; overflow-wrap: anywhere; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.dihuni, .pill.aktif { background: var(--ok-soft); color: var(--ok); }
.pill.kontrak { background: var(--warn-soft); color: var(--warn); }
.pill.kosong, .pill.nonaktif { background: var(--idle-soft); color: var(--idle); }
.act { display: flex; gap: 6px; justify-self: end; flex-wrap: wrap; }
.empty { padding: 36px 20px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty h2 { font-family: var(--font-display); font-size: 22px; margin: 0; }
.empty p { margin: 0; color: var(--muted); max-width: 46ch; }
@media (max-width: 720px) {
  .thead { display: none; }
  .cols-rumah, .cols-akun { grid-template-columns: minmax(0, 1fr) auto; }
  .act { justify-self: start; }
}

.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(8,14,11,.55); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; width: min(560px,100%); padding: 20px; display: flex; flex-direction: column; gap: 14px; max-height: 100%; overflow-y: auto; }
.panel h2 { font-family: var(--font-display); font-size: 22px; margin: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; min-width: 0; }
label.f .hint { font-weight: 400; color: var(--muted); }
textarea.field { min-height: 80px; resize: vertical; }
.form-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.msg { font-size: 13px; color: var(--muted); min-height: 1.4em; }
.msg.err { color: var(--danger); }

.login { max-width: 400px; margin: 8vh auto 0; display: flex; flex-direction: column; gap: 16px; }
.toastwrap { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px)); pointer-events: none; z-index: 30; }
.toast { background: var(--ink); color: var(--bg); border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="note">Memuat…</div></div>
<div class="toastwrap"><div class="toast" id="toast" hidden></div></div>
<script type="module" src="app.js"></script>
</body>
</html>
